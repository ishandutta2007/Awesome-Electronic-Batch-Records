<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    
    /* Animations */
    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    
    .pulsing-grid { animation: pulse 6s infinite ease-in-out; }
    .floating-node { animation: floatParticle 4s infinite ease-in-out; }
    .data-stream { stroke-dasharray: 8, 8; animation: dash 2s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Background Elements (Behind text) -->
  <g class="pulsing-grid">
    <circle cx="150" cy="80" r="120" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />
    <circle cx="1050" cy="220" r="140" fill="#8b5cf6" opacity="0.15" filter="url(#glow)" />
  </g>

  <!-- Background Grid Pattern -->
  <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200" stroke="#334155" stroke-width="0.5" opacity="0.3" />
  <path d="M200 0 V300 M400 0 V300 M600 0 V300 M800 0 V300 M1000 0 V300" stroke="#334155" stroke-width="0.5" opacity="0.3" />

  <!-- Dynamic Data Flow Line (Decorative) -->
  <path d="M 100 240 Q 300 280 500 240 T 900 250 T 1100 210" fill="none" stroke="url(#accentCyan)" stroke-width="2" class="data-stream" opacity="0.6" />
  <path d="M 50 60 Q 300 20 600 70 T 1150 40" fill="none" stroke="url(#accentPurple)" stroke-width="2" class="data-stream" opacity="0.4" />

  <!-- Subtle Animated Tech Nodes in Background Corner -->
  <g class="floating-node" opacity="0.5">
    <circle cx="980" cy="70" r="6" fill="#38bdf8" />
    <circle cx="1040" cy="110" r="4" fill="#a78bfa" />
    <line x1="980" y1="70" x2="1040" y2="110" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4" />
  </g>

  <!-- Foreground Content Block (Guaranteed High Contrast & Readability) -->
  <!-- Top Category Tag -->
  <rect x="80" y="45" width="230" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="195" y="66" text-anchor="middle" class="badge-text">⚡ PHARMA &amp; BIOTECH MES</text>

  <!-- Main Title -->
  <text x="80" y="135" class="title">Awesome Electronic Batch Records</text>

  <!-- Subtitle -->
  <text x="80" y="175" class="subtitle">Curated SaaS Platforms, Open-Source MES &amp; GxP / 21 CFR Part 11 Ecosystem</text>

  <!-- Visual Feature Pills / Tags at Bottom Foreground -->
  <g transform="translate(80, 215)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="36" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="80" y="23" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">📋 Paperless Batch</text>
    
    <!-- Pill 2 -->
    <rect x="175" y="0" width="160" height="36" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="255" y="23" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🔒 21 CFR Part 11</text>

    <!-- Pill 3 -->
    <rect x="350" y="0" width="160" height="36" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="430" y="23" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🏭 ISA-88 / ISA-95</text>

    <!-- Pill 4 -->
    <rect x="525" y="0" width="170" height="36" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="610" y="23" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🧪 Review-by-Exception</text>
  </g>
</svg>
